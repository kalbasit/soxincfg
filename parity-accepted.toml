# Differences between the v1 build (bbb90de / private 4567f38) and the Soxin
# v2 build of the parity hosts, for `soxin-parity --accepted`.
#
# Entries 1 to 3 were accepted by the operator on 2026-10-17, and the two
# reorderings at the end on 2026-10-18. A new
# difference is added only once the operator accepts it, case by case.

[[difference]]
derivation = "nixos-version"
what = "env"
key = "buildPhase"
changed = "configurationRevision"
reason = "system.configurationRevision is soxincfg's own commit, which moves with the port"

[[difference]]
derivation = "darwin-version.json"
what = "env"
key = "__json"
changed = "configurationRevision"
reason = "system.configurationRevision is soxincfg's own commit, which moves with the port"

[[difference]]
derivation = "etc*-registry.json"
what = "env"
key = "text"
changed = '^\s*"(id|lastModified|narHash|rev|revCount|type|url|ref|owner|repo|path)"'
reason = "Nix registry from the flake's inputs: self is the new soxincfg commit, soxin is Soxin v2, soxin-v1 is new"

[[difference]]
hosts = ["saturn"]
derivation = "Brewfile"
what = "env"
key = "text"
reordered = true
reason = """5.2, secretive wrapper deleted: the darwin/local profile now lists the
"secretive" cask itself, so it moves from after "docker-desktop" (where the
wrapper module's definition sat) to the top of the casks. Same casks."""

[[difference]]
hosts = ["saturn", "saturn-nixos-vm"]
derivation = "home-manager-*"
what = "env"
key = "__json"
reordered = true
reason = """5.2, mosh wrapper deleted: the profiles now add pkgs.mosh to
home.packages themselves, so mosh moves before worktrunk in the
home-manager path (and fonts/applications, which list the same packages).
Same packages."""
